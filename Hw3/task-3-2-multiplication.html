<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица умножения</title>
    <style>
        body { text-align: center; }
        table { margin: 0 auto; border-collapse: collapse; }
        th, td { width: 65px; height: 50px; text-align: center; font-size: 20px; }
        th { background-color: lightblue; }
    </style>
</head>
<body>
    <h2>Таблица умножения от 1 до 10</h2>

    <script>
        document.write("<table border='1'>");
        document.write("<tr><th>×</th>");
        for (let j = 1; j <= 10; j++) document.write("<th>" + j + "</th>");
        document.write("</tr>");
        for (let i = 1; i <= 10; i++) {
            document.write("<tr><th>" + i + "</th>");
            for (let j = 1; j <= 10; j++) {
                document.write("<td>" + (i * j) + "</td>");
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
